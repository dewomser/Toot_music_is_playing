on:
  push:
    branches:
      - main

name: 'Trigger: Push action'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    
    - uses: bewuethr/shellcheck-action@v2
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
       additional_files: 'toot_music tweet_music'
